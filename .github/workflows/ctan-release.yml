name: Build CTAN release archive

on:
  workflow_call:
    inputs:
      release_tag:
        description: Release tag to build (for example pdfannex-adapter-template-v1.0.0)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to build (for example pdfannex-adapter-template-v1.0.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  ctan-archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout release source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag }}

      - name: Install TeX tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl make poppler-utils shellcheck texlive-extra-utils texlive-fonts-recommended texlive-latex-base \
            texlive-latex-extra texlive-luatex

      - name: Read release version
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          case "$RELEASE_TAG" in
            pdfannex-adapter-template-v*) version="${RELEASE_TAG#pdfannex-adapter-template-v}" ;;
            *)
              echo "Unexpected release tag: $RELEASE_TAG" >&2
              exit 1
              ;;
          esac
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag does not contain a semantic version: $RELEASE_TAG" >&2
            exit 1
          fi
          package_version="$(sed -E 's/[[:space:]]+# x-release-please-version$//' VERSION)"
          if [[ "$package_version" != "$version" ]]; then
            echo "VERSION does not match release tag $RELEASE_TAG" >&2
            exit 1
          fi
          echo "VERSION=$version" >>"$GITHUB_ENV"

      - name: Check release source
        run: make test

      - name: Build and version CTAN archive
        run: |
          make package
          cp pdfannex-fixture-ctan.zip \
            "pdfannex-fixture-ctan-v${VERSION}.zip"

      - name: Attach archive to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release upload "$RELEASE_TAG" \
            "pdfannex-fixture-ctan-v${VERSION}.zip" \
            build/distrib/tds/pdfannex-fixture.tds.zip \
            build/distrib/tds/install-texmfhome-tds.sh \
            --clobber

      - name: Upload adapter TDS archive for installation tests
        uses: actions/upload-artifact@v7
        with:
          name: fixture-adapter-tds-archive
          path: |
            build/distrib/tds/pdfannex-fixture.tds.zip
            build/distrib/tds/install-texmfhome-tds.sh
          if-no-files-found: error
